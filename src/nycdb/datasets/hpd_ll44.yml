  -
    url: https://data.cityofnewyork.us/api/v3/views/ucdy-byxd/export.csv
    dest: hpd_ll44_projects.csv
  -
    url: https://data.cityofnewyork.us/api/v3/views/72vt-ykjc/export.csv
    dest: hpd_ll44_tax_incentive.csv
sql:
    - hpd_ll44.sql
schema:
  -
    table_name: hpd_ll44_buildings
    fields:
      Projectid: integer
      Buildingid: integer
      Reportingconstructiontype: text
      BoroughCode: char(1)
      Borough: text
      Block: integer
      Lot: integer
      Bin: char(7)
      Housenumber: text
      Streetname: text
      Countedrentalunits: integer
      Countedhomeownershipunits: integer
      Allcountedunits: integer
      Totalbuildingunits: integer
      Basesquarefootage: integer
      Stories: integer
